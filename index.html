<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eff6ff" />
    <!-- Set the theme before any CSS paints to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'system'
          var dark =
            t === 'dark' ||
            (t === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
            var m = document.querySelector('meta[name="theme-color"]')
            if (m) m.setAttribute('content', '#0b1220')
          }
        } catch (e) {}
      })()
    </script>
    <!-- iOS home-screen / standalone support -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Attendance" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Attendance</title>
    <style>
      /* Branded launch splash — icon + title only, shown until the app is ready */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background-color: #eff6ff;
        background-image:
          radial-gradient(at 18% 12%, rgba(96, 165, 250, 0.3) 0, transparent 55%),
          radial-gradient(at 85% 18%, rgba(59, 130, 246, 0.2) 0, transparent 50%),
          radial-gradient(at 50% 100%, rgba(147, 197, 253, 0.24) 0, transparent 55%);
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #splash.splash--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #splash .splash-icon {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 14px 30px rgba(37, 99, 235, 0.35));
        animation:
          splashPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) both,
          splashFloat 3s ease-in-out 0.6s infinite;
      }
      #splash .splash-title {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #0f172a;
        animation: splashFade 0.6s ease 0.15s both;
      }
      @keyframes splashPop {
        0% { transform: scale(0.72); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes splashFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes splashFade {
        0% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-icon,
        #splash .splash-title { animation: none; }
      }
      /* Dark theme splash (class is set by the inline script above before paint) */
      .dark #splash {
        background-color: #0b1220;
        background-image:
          radial-gradient(at 18% 12%, rgba(37, 99, 235, 0.22) 0, transparent 55%),
          radial-gradient(at 85% 18%, rgba(30, 64, 175, 0.18) 0, transparent 50%),
          radial-gradient(at 50% 100%, rgba(30, 58, 138, 0.2) 0, transparent 55%);
      }
      .dark #splash .splash-title {
        color: #f1f5f9;
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Attendance App loading">
      <svg
        class="splash-icon"
        viewBox="0 0 512 512"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <rect width="512" height="512" rx="112" fill="#2563eb" />
        <g
          transform="translate(128,128) scale(10.6667)"
          fill="none"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 2v4" /><path d="M16 2v4" />
          <rect width="18" height="18" x="3" y="4" rx="2" />
          <path d="M3 10h18" /><path d="m9 16 2 2 4-4" />
        </g>
      </svg>
      <p class="splash-title">Attendance App</p>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var splash = document.getElementById('splash')
        if (!splash) return
        var done = false
        function reveal() {
          if (done) return
          done = true
          splash.classList.add('splash--hidden')
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash)
          }, 500)
        }
        // Hide shortly after the page has loaded; safety net if 'load' is slow.
        window.addEventListener('load', function () {
          setTimeout(reveal, 500)
        })
        setTimeout(reveal, 2500)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
